# Build iOS sur un Mac GitHub (gratuit pour un dépôt public) avec `eas build --local`,
# puis envoi sur App Store Connect. Lancement manuel : onglet Actions > iOS build > Run workflow.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Envoyer le build sur App Store Connect
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build
        run: npx --yes eas-cli@latest build -p ios --profile production --local --non-interactive --output "$RUNNER_TEMP/app.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/app.ipa
          retention-days: 7

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          jq --arg p "$RUNNER_TEMP/asc.p8" --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" \
            '.submit.production.ios += {ascApiKeyPath: $p, ascApiKeyId: $k, ascApiKeyIssuerId: $i}' eas.json > eas.tmp && mv eas.tmp eas.json
          npx --yes eas-cli@latest submit -p ios --profile production --path "$RUNNER_TEMP/app.ipa" --non-interactive
